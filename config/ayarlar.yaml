  durum: "bağlandı (2026-10-26); token ve kullanıcının chat id'si .env içinde (TG_*); bot sadece bu chat id'yi dinleyecek"
  kurulum_betigi: "scripts/telegram_kur.sh"

magnific:
  durum: "bağlandı (2026-10-26); API anahtarı 'IlmSanat Otomasyon' .env içinde (MAGNIFIC_API_KEY), doğrulandı"
  api: "https://api.magnific.com  (başlık: x-magnific-api-key)"
  odeme: "aboneliğin kredilerinden düşer (Premium, ~240K kredi/yıl); ayrı ödeme yok"
  kullanilacaklar:
    gorsel: "text-to-image (Mystic / Flux / Seedream) — klasik yağlı boya stili"
    video: "image-to-video (Kling) — görselden kısa hareketli video"
    muzik: "music-generation (Google Lyria) — 30 sn enstrümantal"
  calisma: "istek task_id döner; status COMPLETED olana kadar sorgulanır"

claude_api:
  durum: "anahtar 'ilmsanat-otomasyon' oluşturuldu (2026-10-26), .env içinde (ANTHROPIC_API_KEY), doğrulandı; 26.10.2027'de sona erer"
  kredi: "henüz yüklenmedi; kredi yüklenene kadar metin üretimi çalışmaz (öneri: 5 $, aylık limit 5 $, auto-reload kapalı)"
  modeller:
    haber_secimi: "claude-haiku-5-5"    # ucuz: çok sayıda başlığı puanlama
    metin_yazimi: "claude-sonnet-5-5"   # İngilizce akademik uzun metin

video:
  format: "1080x1920 Reels/TikTok, 30 fps; stil: STIL_REHBERI.md (örnek: @insidegeopolitics)"
  arac: "Remotion 4.0.228 (video/ klasörü), Node 22 ~/.local/node; şablon video/src/HaberVideo.tsx, veri JSON'u (ör. video/src/ornek_mecca.json)"
  seslendirme: "Magnific /v1/ai/voiceover/elevenlabs-turbo-v2-5, ses 'Daniel' onwK4e9ZLuTAKqWW03F9, hız 0.95"
  gorsel: "Magnific /v1/ai/text-to-image/seedream-v4-5, aspect_ratio social_story_9_16 (dönen dosya JPEG)"
  hareket: "Magnific /v1/ai/image-to-video/kling-v2-6-pro (durum adresi /kling-v2-6/{id}), 5 sn, 0.45 hızla yavaşlatılır"
  muzik: "Magnific /v1/ai/music-generation/google-lyria (30 sn WAV, şablonda döngülenir)"
  ornek: "ornek/2026-10-26_mecca/ilmsanat_mecca_alliance.mp4 (52.7 sn)"

paylasim_kurallari:
  yapay_zeka_notu: "ASLA yazılmaz — videoda, açıklamada, etikette hiçbir yerde (kullanıcı kararı 2026-10-26); TikTok AI bayrağı işaretlenmez"
  kaynak: "videoda yazılmaz; sadece Instagram/TikTok açıklama metninde 'Source: …' olarak"

