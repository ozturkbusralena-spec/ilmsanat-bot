# İlm Sanat – otomasyon ayarları (kararlaştırılanlar, 2026-10-26)

marka:
  ad: "İlm Sanat"
  instagram: "ilmsanat"   # kullanıcı adını doğrula
  tiktok: null            # hesap kuruluyor
  logo: "Mein Logi Ilmsanat transparent.png"
  renkler:                # kullanıcının verdiği marka renkleri (2026-10-26)
    lacivert: "#142d54"   # Dunkelblau (kullanıcının marka rengi)
    yesil: "#183c25"      # Dunkelgrün (kullanıcının marka rengi)
    altin: "#907640"      # Grauorange (kullanıcının marka rengi)
    fildisi: "#f3ecdc"
  yazi_tipi:              # logodaki harflere en yakın: Open Sans SemiBold; kullanıcı kendi fontunu verirse değişecek
    baslik: "Open Sans SemiBold (geniş harf aralığı)"
    vurgu: "Cormorant Garamond Italic"
  facebook_kapak: "marka/facebook_kapak.png"  # kaynak: marka/kaynak/facebook_kapak.html

dil: "en"                 # paylaşımlar İngilizce
ton: "ciddi, akademik"
metin_uzunlugu: "uzun"    # IG açıklama sınırı 2200 karakter, TikTok foto açıklaması 4000

saat_dilimi: "Europe/Vienna"
paylasim_saatleri:
  # Orta Doğu + Avrupa + ABD kitlesini birlikte yakalayan saatler.
  # Günde 3 paylaşım (2026-10-26 kararı): 2 haber + 1 analiz.
  # Viyana 09:00 = Körfez 11:00/12:00 (Avrupa sabahı)
  # Viyana 14:00 = Körfez 16:00/17:00, New York 08:00
  # Viyana 18:00 = İstanbul 20:00, Körfez 21:00, New York 12:00
  # İlk ay sonunda Instagram istatistiklerine bakıp ayarlanacak.
  haber_1: "09:00"
  analiz: "14:00"
  haber_2: "18:00"    # 2026-10-28: 20:00 geç bulundu, 18:00 yapıldı
  pazar_tablo: "11:00"    # Pazar: 2 haber + 1 analiz + 1 tablo = 4 paylaşım (onaylandı 2026-10-26)

haber_secimi:   # ayrıntılı kurallar: config/kaynaklar.yaml → secim
  oncelik_sirasi:
    - "Orta Doğu jeopolitiği (en önemli)"
    - "Kuzey Afrika"
    - "MENA ile bağlantılı Afrika ülkeleri (Somali, Sudan vb.)"
    - "Genel jeopolitik: Çin, Rusya vb. (özellikle MENA ile ilişkisi)"
    - "Siyasi tarih: Balfour Deklarasyonu, Filistin-İsrail toprak meselesi vb."
  tazelik: "en yeni haberler tercih edilir; tarih konuları tazelik şartı olmadan girebilir"
  analizler: "her gün 1 analiz paylaşımı; ilk tercih AA Analiz (en güvenilir), sonra SETA, MEE, MEMO"

gorsel:
  stil: "klasik sanat havası – 19. yy akademik yağlı boya / gravür / eski harita dokusu"
  kural: "yapay zeka gibi görünmesin: pürüzsüz plastik görünüm, aşırı parlaklık, yakın plan yüz, bozuk yazı yok"
  gercek_kisi: false      # tanınabilir gerçek kişi çizilmez
  servis: "Magnific (görsel + müzik + video)"   # API erişimi daha sonra ayarlanacak
  boyutlar:
    instagram: "1080x1350"
    tiktok: "1080x1920"

pazar_sanat:
  tur: "oryantalist tablo (gerçek eser, kamu malı)"
  aciklama: "tablonun hikâyesi + ressamın kısa biyografisi"
  filtre: "çıplaklık içeren eserler elenir"

onay:
  kanal: "telegram"
  akis: "paylaşımdan önce taslak Telegram'a gelir → Onayla / Değiştir (yazılı talimat) / Atla"
  zaman_asimi_davranisi: "otomatik_paylas"   # cevap gelmezse paylaşım saatinde otomatik paylaşılır

telegram:
  bildirimler: ["onay taslakları", "hata bildirimleri", "paylaşım sonuç linkleri"]
  komutlar: ["link göndererek özel içerik isteme", "belirli bir konu üzerine içerik isteme"]

butce_aylik_usd: 15

