  proje: "Google Cloud 'IlmSanat Otomasyon' (true-episode-512822-m2), OAuth istemci 'IlmSanat Drive' (masaüstü)"
  izin: "drive.file — yalnızca otomasyonun kendi yüklediği dosyalar"
  klasor: "İlm Sanat Paylaşımlar (id .env içinde GD_KLASOR_ID); en fazla 5 video, eskiler kalıcı silinir"
